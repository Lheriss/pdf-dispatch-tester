services:

  pdf-dispatch-test:
    image: ghcr.io/lheriss/pdf-dispatch:dev
    # :dev is a mutable tag republished on every push to the dev branch.
    # pull_policy: always ensures a fresh pull on each (re)creation instead of
    # reusing a cached layer — mirror this with Portainer's "re-pull image"
    # option when updating the stack (see below).
    pull_policy: always
    container_name: pdf-dispatch-test
    restart: unless-stopped

    # pdf-dispatch's own email poller (phase4-greenmail config) starts dialing
    # IMAP as soon as the app boots — it doesn't wait for docker-compose
    # ordering on its own. Without this, pdf-dispatch could start before
    # GreenMail has opened its ports and fail its first poll with
    # "[Errno 111] Connection refused" (a plain TCP-level refusal, distinct
    # from the "Invalid login/password" auth race fixed on the greenmail
    # service below — this is pdf-dispatch racing GreenMail's startup, not
    # the tester racing it).
    depends_on:
      greenmail:
        condition: service_healthy

    environment:
      DATA_DIR: /data
      PUID:     "1026"
      PGID:     "100"
      TZ:       "Europe/Zurich"
      # APP_VERSION is injected at build time via ARG GIT_SHA in the Dockerfile.
      # Do NOT set it here — a docker-compose value would override the build arg
      # and break the SHA tracing in /api/runtime and session.log.
      API_KEY:      "53b9ac3d008b42d0c12c5bf7a24ca55632c1bbfba74f98c2dc40c1d0c0687fff"
      EMAIL_SECRET: "0b6af7640f76309263617563d2a365dd8016cc02584a2d58ffc5eadd6b573b72"
      # Predefined web-interface administrator account (pdf-dispatch >= 1.8):
      # skips the first-run setup page, whose one-time code is only printed in
      # this container's log and is therefore out of the tester's reach.
      # Must match TESTER_ADMIN_USER / TESTER_ADMIN_PASSWORD below.
      APP_USERNAME: "pdftester-admin"
      APP_PASSWORD: "pdftester-admin-password"

      # ── Barcode scanning ─────────────────────────────────────────────────────
      BARCODE_SCANNER:  ZXING
      BARCODE_DPI:      "300"   # Pass 2 — high-res re-decode on pages where a code
                                #  was detected in pass 1.  300 DPI = maximum accuracy.
      BARCODE_DPI_SCAN: "200"   # Pass 1 — fast scan of all pages to locate codes.
                                #  200 DPI = production default → tests the real behavior.
                                #  Pages where a code is detected are re-scanned at
                                #  BARCODE_DPI (300) for full accuracy (two-pass mode).

      # ── Logging & stability ───────────────────────────────────────────────────
      MAX_LOG_ENTRIES:      "500"
      FILE_STABLE_TIMEOUT:  "15"
      FILE_STABLE_INTERVAL: "1"

      # ── Resource limits (intentionally tighter than prod for test coverage) ───
      MAX_UPLOAD_MB:             "20"   # test_email_attachment_too_large expects <20 MB guard
      MAX_PAGES:                 "50"   # test_email_max_pages sends 60-page PDF → rejected
      MAX_CONCURRENT_PROCESSING: "2"
      MAX_WORKER_THREADS:        "8"    # max(8, MAX_CONCURRENT_PROCESSING + 4) = 8

      # ── Timeouts ─────────────────────────────────────────────────────────────
      API_TASK_TIMEOUT: "120"

      # ── Retention (enabled so Phase 8 TestRetention actually runs) ────────────
      # Large thresholds: real test files are 0-day (recent) and are removed
      # explicitly by the test via 400-day mtimes + POST /api/retention/run,
      # so no genuine output is ever deleted during a normal test run.
      RETENTION_DAYS_PROCESSED: "90"
      RETENTION_DAYS_ERROR:     "30"

      # ── Blank-page splitting (enabled so Phase 8 TestBlankPageSplit runs) ─────
      BLANK_PAGE_SPLIT:     "true"
      BLANK_PAGE_THRESHOLD: "0.005"

      # ── Security (disabled for tests — tester calls localhost webhooks) ───────
      SSRF_PROTECTION: "off"

    volumes:
      - "/volume1/docker/pdf_test/data:/data"

    mem_limit: 1536m
    memswap_limit: 1536m

    ports:
      - "5881:5000"   # pdf-dispatch UI
      - "5883:5883"   # tester web UI (partagé via network_mode: service:)

  pdf-dispatch-tester:
    image: ghcr.io/lheriss/pdf-dispatch-tester:latest
    # :latest is a mutable tag republished on every push to main — same as
    # pdf-dispatch-test above. Without pull_policy: always, Docker can keep
    # reusing a cached copy of this image even after a newer :latest exists on
    # the registry, silently re-running stale test code. Mirror this with
    # Portainer's "re-pull image" option when updating the stack.
    pull_policy: always
    # Pas de container_name : incompatible avec network_mode: service:
    restart: unless-stopped
    network_mode: "service:pdf-dispatch-test"
    shm_size: '512m'   # Chromium (Playwright) needs >=256 MB shared memory

    depends_on:
      pdf-dispatch-test:
        condition: service_healthy
      greenmail:
        condition: service_healthy

    environment:
      # Réseau partagé → localhost:5000 = pdf-dispatch
      TESTER_SERVER:  "http://localhost:5000"
      WEBHOOK_HOST:   "localhost"

      TESTER_API_KEY: "53b9ac3d008b42d0c12c5bf7a24ca55632c1bbfba74f98c2dc40c1d0c0687fff"
      # Same values as APP_USERNAME / APP_PASSWORD above — used by the sign-in
      # tests (test_05 TestWebSignIn, test_07 TestUiSignIn). Leave empty to
      # skip those tests against an instance without a predefined account.
      TESTER_ADMIN_USER:     "pdftester-admin"
      TESTER_ADMIN_PASSWORD: "pdftester-admin-password"
      # Stale-instance check (instance_check.py): the version answering on
      # localhost:5000 is compared with every instance named pdf-dispatch-test;
      # a mismatch shows a red banner, disables "Lancer" and stops pytest.
      # Optional: also require a version prefix, e.g. "v1.8.1-3".
      # TESTER_EXPECT_VERSION: ""
      TESTER_DATA:    "/data"
      WEBHOOK_PORT:   "5882"
      TZ:             "Europe/Zurich"

      WEB_MODE:   "1"
      WEB_PORT:   "5883"
      # PYTEST_ARGS: "-v --tb=short"  # WEB_MODE=0 seulement

    volumes:
      - "/volume1/docker/pdf_test/data:/data"
      - "/volume1/docker/pdf_test/logs:/app/logs"
      - "/volume1/docker/pdf_test/report:/app/report"

  # ── Greenmail — lightweight IMAP/SMTP server for Phase 4 email tests ─────
  greenmail:
    image: greenmail/standalone:2.0.1
    restart: unless-stopped
    environment:
      # Single line — avoid YAML folding ambiguity with Portainer.
      # Domain @greenmail matches the container hostname → no external DNS lookup.
      #
      # ⚠⚠⚠ RECURRING REGRESSION — READ BEFORE EDITING ⚠⚠⚠
      # The tester logs in over IMAP as username='pdftester' / password='pdftester'.
      # GreenMail auto-creates an account on SMTP delivery with login = password =
      # the *full* To: address ('pdftester@greenmail'), which does NOT match the
      # IMAP login the tester uses → "Invalid login/password for user id pdftester".
      # Previous attempts to fix this by preseeding the user (via -Dgreenmail.users
      # or the REST API on :8080) were fragile: the REST call from the tester was
      # unreachable under network_mode: service:, and SMTP auto-creation raced ahead.
      #
      # ROBUST FIX: -Dgreenmail.auth.disabled makes GreenMail accept ANY password
      # for any account (documented: "Disables user authentication check, so that
      # any password works ... GreenMail automatically creates non-existent users").
      # This is a throwaway test mailserver, so accepting any password is fine, and
      # it removes the whole login/password-matching problem at the source.
      # No Phase 4 test asserts that a wrong IMAP password is rejected, so this is safe.
      # -Dgreenmail.users= is kept so the pdftester@greenmail mailbox exists up front.
      #   → IMAP login pdftester / any password  ·  SMTP To: pdftester@greenmail
      #
      # ⚠ SECOND FAILURE MODE (same symptom, different cause): if GreenMail's
      # startup health check times out (default 2000 ms) because a server — in
      # practice smtps:3465 — is slow to bind on a loaded host, GreenMail.start()
      # throws in the main thread BEFORE the flags above are applied. auth then
      # silently reverts to enabled and pdftester is never seeded, so every IMAP
      # login fails with the exact same "Invalid login/password" message even
      # though this config is correct. Guarded by -Dgreenmail.startup.timeout,
      # by not starting the unused smtps server, AND by a healthcheck that
      # performs a real IMAP login (tester waits for service_healthy).
      # -Dgreenmail.startup.timeout=15000 — the per-server startup health check
      # defaults to 2000 ms. On a loaded host the smtps server (:3465) can take
      # longer to bind, and GreenMail.start() then throws in the main thread
      # BEFORE the setup flags (users, auth.disabled) are applied — which
      # silently reintroduces the "Invalid login/password" failure even though
      # the config is correct. A generous timeout makes startup robust.
      #
      # Only the servers the tester actually uses are started (instead of
      # -Dgreenmail.setup.test.all, which also starts smtps:3465, pop3:3110 and
      # pop3s:3995): smtp:3025 (tester sends mail), imap:3143 (tester preflight
      # login) and imaps:3993 (pdf-dispatch polls the mailbox). smtps:3465 —
      # the server that kept aborting startup (seen again on 2026-10-17, on a
      # stack still deployed without startup.timeout) — is simply not started.
      GREENMAIL_OPTS: "-Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.setup.test.imaps -Dgreenmail.users=pdftester:pdftester@greenmail -Dgreenmail.hostname=greenmail -Dgreenmail.auth.disabled -Dgreenmail.startup.timeout=15000 -Dgreenmail.verbose=false"
    # Healthcheck: healthy only when GreenMail is REALLY usable — an actual
    # IMAP "LOGIN pdftester pdftester" must succeed, then SMTP (3025) and
    # IMAPS (3993) must accept a connection. A port-only probe is not enough:
    # when startup aborts (failure mode above), the servers still listen but
    # without the pdftester account / auth.disabled, and every login fails.
    # With this check the tester (condition: service_healthy) waits instead of
    # running Phase 4 against a broken mail server; recreate the greenmail
    # container if it stays unhealthy.
    # Host is "greenmail", NOT localhost: -Dgreenmail.hostname=greenmail makes
    # every server bind to that address only (bindAddress='greenmail' in the
    # GreenMail log), so localhost would never answer.
    # The base image (Azul Zulu, Debian) has bash but no nc/curl → bash
    # /dev/tcp. "$$" escapes "$" from docker-compose / Portainer interpolation.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/greenmail/3143 || exit 1; read -t 5 -r l <&3; printf 'h LOGIN pdftester pdftester\\r\\n' >&3; ok=0; while read -t 5 -r l <&3; do case \"$$l\" in 'h OK'*) ok=1; break;; 'h '*) break;; esac; done; printf 'h2 LOGOUT\\r\\n' >&3; exec 3>&-; [ \"$$ok\" = 1 ] && (</dev/tcp/greenmail/3025) && (</dev/tcp/greenmail/3993)"]
      interval: 5s
      timeout: 15s
      retries: 12
      start_period: 30s
    # Logs consultables via Portainer → container log viewer (pas d'entrypoint override)
